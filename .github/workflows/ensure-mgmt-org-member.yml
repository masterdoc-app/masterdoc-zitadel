name: Ensure Mgmt PAT Org Member

on:
  workflow_dispatch:
    inputs:
      extra_org_ids:
        description: Space-separated client org ids (gateway tenant orgs)
        required: true
        default: "382715225649971203 383177088934346755"
      roles:
        description: Org member roles for the PAT user
        required: true
        default: ORG_USER_MANAGER

concurrency:
  group: ensure-mgmt-org-member-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ensure:
    name: Grant ORG_USER_MANAGER on client orgs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets
        env:
          DOMAIN: ${{ secrets.ZITADEL_DOMAIN }}
          TOKEN: ${{ secrets.ZITADEL_TOKEN }}
        run: |
          test -n "$DOMAIN" || { echo "Add secret ZITADEL_DOMAIN"; exit 1; }
          test -n "$TOKEN" || { echo "Add secret ZITADEL_TOKEN"; exit 1; }

      - name: Ensure org membership for PAT
        env:
          ZITADEL_DOMAIN: ${{ secrets.ZITADEL_DOMAIN }}
          ZITADEL_TOKEN: ${{ secrets.ZITADEL_TOKEN }}
          EXTRA_ORG_IDS: ${{ inputs.extra_org_ids }}
          MGMT_ORG_ROLES: ${{ inputs.roles }}
        run: |
          set -o pipefail
          chmod +x scripts/ensure-mgmt-org-member.sh
          scripts/ensure-mgmt-org-member.sh | tee /tmp/mgmt-member-out.txt
