name: Ensure Password Complexity

on:
  workflow_dispatch:
    inputs:
      min_length:
        description: Minimum password length
        required: true
        default: "8"

concurrency:
  group: ensure-password-complexity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ensure:
    name: Password complexity (min length only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets
        env:
          DOMAIN: ${{ secrets.ZITADEL_DOMAIN }}
          TOKEN: ${{ secrets.ZITADEL_TOKEN }}
        run: |
          test -n "$DOMAIN" || { echo "Add secret ZITADEL_DOMAIN"; exit 1; }
          test -n "$TOKEN" || { echo "Add secret ZITADEL_TOKEN"; exit 1; }

      - name: Ensure password complexity
        env:
          ZITADEL_DOMAIN: ${{ secrets.ZITADEL_DOMAIN }}
          ZITADEL_TOKEN: ${{ secrets.ZITADEL_TOKEN }}
          MIN_LENGTH: ${{ inputs.min_length }}
        run: |
          set -o pipefail
          chmod +x scripts/ensure-password-complexity.sh
          scripts/ensure-password-complexity.sh | tee /tmp/pc-out.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## Password complexity"
            if [[ -f /tmp/pc-out.txt ]]; then
              echo '```'
              cat /tmp/pc-out.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
