# Live site on VPS: /etc/nginx/sites-available/auth.fixaverse.ru
# Proxies to Traefik (Compose external-tls) on 127.0.0.1:18080
# Certs: certbot certonly --webroot -w /var/www/certbot -d auth.fixaverse.ru

upstream zitadel_traefik {
    server 127.0.0.1:18080;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.fixaverse.ru;

    ssl_certificate /etc/letsencrypt/live/auth.fixaverse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.fixaverse.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://zitadel_traefik;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.fixaverse.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
