# Example nginx in front of Traefik (external TLS mode).
# Replace auth.example.com / server_name with ${ZITADEL_DOMAIN}.
# DNS A-record → ${ZITADEL_DEPLOY_HOST} (secret). Do not hardcode VPS IP in git.
#
# compose: docker compose -f docker-compose.yml -f docker-compose.mode-external-tls.yml up -d
# Traefik listens on 127.0.0.1:8080; nginx owns public :80/:443.

upstream zitadel_traefik {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name auth.example.com;

    # ssl_certificate     /etc/letsencrypt/live/auth.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/auth.example.com/privkey.pem;

    # HTTP/2 / gRPC-friendly proxy to Traefik (h2c inside Docker).
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_pass http://zitadel_traefik;
    }
}

server {
    listen 80;
    server_name auth.example.com;
    return 301 https://$host$request_uri;
}
