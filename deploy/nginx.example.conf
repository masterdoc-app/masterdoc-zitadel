# Example nginx in front of Traefik (external TLS mode).
# Replace auth.example.com with ${ZITADEL_DOMAIN}. Do not hardcode VPS IP in git —
# point DNS A-record at ${ZITADEL_DEPLOY_HOST} from secrets.
#
# compose: docker compose -f docker-compose.yml -f docker-compose.mode-external-tls.yml up -d
# Traefik listens on host :80; nginx terminates TLS and proxies http://127.0.0.1:80

upstream zitadel_traefik {
    server 127.0.0.1:80;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name auth.example.com;

    # ssl_certificate     /etc/letsencrypt/live/auth.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/auth.example.com/privkey.pem;

    # HTTP/2 end-to-end to Traefik/Zitadel is required for Console/gRPC.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_pass http://zitadel_traefik;
    }
}

server {
    listen 80;
    server_name auth.example.com;
    return 301 https://$host$request_uri;
}
